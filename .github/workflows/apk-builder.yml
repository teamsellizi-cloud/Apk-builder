name: APK Builder Cloud Runner

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique Build ID'
        required: true
        type: string
      build_type:
        description: 'Conversion Type (website, zip, pwa)'
        required: true
        type: string
      app_name:
        description: 'Application Name'
        required: true
        type: string
      package_id:
        description: 'Package Identifier (e.g. com.example.app)'
        required: true
        type: string
      version_name:
        description: 'Version Name'
        required: true
        default: '1.0.0'
        type: string
      version_code:
        description: 'Version Code'
        required: true
        default: '1'
        type: string
      source_url:
        description: 'Target Website or PWA URL'
        required: false
        type: string
      zip_download_url:
        description: 'Signed Download URL for ZIP Source'
        required: false
        type: string
      assets_download_url:
        description: 'Signed Download URL for the app icon and splash image'
        required: false
        default: ''
        type: string
      apk_upload_url:
        description: 'Signed Upload URL for Direct Supabase Storage Upload'
        required: true
        type: string
      config_json:
        description: 'App Customization JSON'
        required: true
        type: string
      callback_url:
        description: 'Webhook Endpoint for reporting status and logs'
        required: true
        type: string
      callback_token:
        description: 'Secure Webhook Authentication Token'
        required: true
        type: string

jobs:
  # ============================================================================
  # JOB 1: Isolated Untrusted Compilation (NO ACCESS TO SECRETS OR KEYSTORES)
  # ============================================================================
  compile-untrusted-apk:
    name: Compile Android Project & Bytecode
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Build Tools
        run: |
          npm install -g @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @bubblewrap/cli@^1.19.0

      - name: Report Build Started
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
        run: |
          curl -s -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -d '{"status":"building","progress":20,"step":"Initializing native Android project structure"}'

      - name: Generate Project, Apply Customizations & Extract Sources
        env:
          BUILD_ID: ${{ inputs.build_id }}
          BUILD_TYPE: ${{ inputs.build_type }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_ID: ${{ inputs.package_id }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          SOURCE_URL: ${{ inputs.source_url }}
          ZIP_DOWNLOAD_URL: ${{ inputs.zip_download_url }}
          CONFIG_JSON: ${{ inputs.config_json }}
          ASSETS_DOWNLOAD_URL: ${{ inputs.assets_download_url }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
        run: |
          set -e
          mkdir -p workspace
          cd workspace

          if [ -n "$ASSETS_DOWNLOAD_URL" ]; then
            curl -fsSL "$ASSETS_DOWNLOAD_URL" -o assets_payload.json || echo "Warning: could not download the icon and splash images"
            # ImageMagick converts any logo (png, jpg, webp, ico, svg) into the sizes Android needs
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick librsvg2-bin || echo "Warning: could not install ImageMagick"
          fi

          # Run Node.js configurator to create project files and apply full customization
          cat << 'EOF' > configure_app.js
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          const buildType = process.env.BUILD_TYPE;
          const appName = process.env.APP_NAME || 'My App';
          const packageId = process.env.PACKAGE_ID || 'com.example.app';
          const versionName = process.env.VERSION_NAME || '1.0.0';
          const versionCode = process.env.VERSION_CODE || '1';
          const sourceUrl = process.env.SOURCE_URL || '';
          let config = {};

          try {
            config = JSON.parse(process.env.CONFIG_JSON || '{}');
          } catch (e) {
            console.warn('Could not parse CONFIG_JSON, using fallback configuration');
          }

          try {
            if (fs.existsSync('assets_payload.json')) {
              const assets = JSON.parse(fs.readFileSync('assets_payload.json', 'utf8'));
              if (assets.iconDataUrl && assets.iconDataUrl.startsWith('data:image/')) config.iconDataUrl = assets.iconDataUrl;
              if (assets.splashImageDataUrl && assets.splashImageDataUrl.startsWith('data:image/')) config.splashImageDataUrl = assets.splashImageDataUrl;
            }
          } catch (e) {
            console.warn('Could not read the downloaded icon and splash images');
          }

          console.log(`Configuring project: ${appName} (${packageId} v${versionName})`);

          // 1. Initialize Capacitor Base Package
          fs.writeFileSync('package.json', JSON.stringify({
            name: packageId.replace(/[^a-z0-9]/gi, '-').toLowerCase(),
            version: versionName,
            private: true,
            dependencies: {
              '@capacitor/core': '^6.0.0',
              '@capacitor/android': '^6.0.0'
            }
          }, null, 2));

          execSync('npm install --no-audit --no-fund', { stdio: 'inherit' });

          // 2. Configure Capacitor JSON
          const capConfig = {
            appId: packageId,
            appName: appName,
            webDir: 'www',
            bundledWebRuntime: false,
            server: {
              url: (buildType === 'website' || buildType === 'pwa') && sourceUrl ? sourceUrl : undefined,
              cleartext: Boolean(config.cleartextTraffic),
              androidScheme: 'https'
            },
            android: {
              allowMixedContent: Boolean(config.cleartextTraffic)
            }
          };

          fs.writeFileSync('capacitor.config.json', JSON.stringify(capConfig, null, 2));
          fs.mkdirSync('www', { recursive: true });

          if (!fs.existsSync('www/index.html')) {
            fs.writeFileSync('www/index.html', `<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${appName}</title><style>body{font-family:sans-serif;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}</style></head><body><h1>Loading ${appName}...</h1></body></html>`);
          }

          // 3. Add Android Native Project
          execSync('npx cap add android', { stdio: 'inherit' });

          // 4. Inject Native Customizations: AndroidManifest.xml, colors.xml, styles.xml
          const androidDir = path.join('android', 'app', 'src', 'main');
          const manifestPath = path.join(androidDir, 'AndroidManifest.xml');
          const resValuesDir = path.join(androidDir, 'res', 'values');

          fs.mkdirSync(resValuesDir, { recursive: true });

          // ---- Launcher icon + splash image (converted with ImageMagick) ----
          const resDir = path.join(androidDir, 'res');
          const DENSITIES = [
            { name: 'mdpi', scale: 1, icon: 48 },
            { name: 'hdpi', scale: 1.5, icon: 72 },
            { name: 'xhdpi', scale: 2, icon: 96 },
            { name: 'xxhdpi', scale: 3, icon: 144 },
            { name: 'xxxhdpi', scale: 4, icon: 192 },
          ];
          const { execFileSync } = require('child_process');
          let imBin = null;
          for (const candidate of ['magick', 'convert']) {
            try { execSync(candidate + ' -version', { stdio: 'ignore' }); imBin = candidate; break; } catch (e) { /* try next */ }
          }
          if (!imBin) console.warn('ImageMagick not available: the default launcher icon will be used.');

          function im(args) { execFileSync(imBin, args, { stdio: 'inherit' }); }

          function identify(file) {
            const out = imBin === 'magick'
              ? execFileSync('magick', ['identify', '-format', '%w %p\n', file])
              : execFileSync('identify', ['-format', '%w %p\n', file]);
            return out.toString().trim().split('\n').map((l) => l.trim().split(/\s+/).map(Number)).filter((a) => a.length === 2 && !isNaN(a[0]));
          }

          function decodeImage(dataUrl, baseName) {
            const m = /^data:([^;,]+)(;base64)?,([\s\S]*)$/.exec(dataUrl || '');
            if (!m) return null;
            const mime = m[1].toLowerCase();
            let ext = 'png';
            if (mime.includes('svg')) ext = 'svg';
            else if (mime.includes('icon') || mime.includes('ico')) ext = 'ico';
            else if (mime.includes('jpeg') || mime.includes('jpg')) ext = 'jpg';
            else if (mime.includes('webp')) ext = 'webp';
            else if (mime.includes('gif')) ext = 'gif';
            const buf = m[2] ? Buffer.from(m[3], 'base64') : Buffer.from(decodeURIComponent(m[3]));
            const file = baseName + '.' + ext;
            fs.writeFileSync(file, buf);
            return { file, ext };
          }

          // Convert any image to a clean transparent PNG. square=true pads it to 512x512.
          function makePng(src, out, square) {
            let settings = [];
            let input = src.file + '[0]';
            if (src.ext === 'svg') {
              settings = ['-background', 'none', '-density', '384'];
              input = src.file;
            } else if (src.ext === 'ico') {
              try {
                const frames = identify(src.file).sort((a, b) => b[0] - a[0]);
                input = src.file + '[' + frames[0][1] + ']';
              } catch (e) { input = src.file + '[0]'; }
            }
            const finish = square
              ? ['-background', 'none', '-alpha', 'on', '-resize', '512x512', '-gravity', 'center', '-extent', '512x512']
              : ['-background', 'none', '-alpha', 'on', '-resize', '1024x1024>'];
            im([...settings, input, ...finish, out]);
          }

          let iconBase = null;
          if (imBin && config.iconDataUrl && config.iconDataUrl.startsWith('data:image/')) {
            try {
              const src = decodeImage(config.iconDataUrl, 'icon_source');
              if (src) { iconBase = path.resolve('icon_base.png'); makePng(src, iconBase, true); }
            } catch (err) {
              console.warn('Could not process the app icon: ' + err.message);
              iconBase = null;
            }
          }

          if (iconBase) {
            for (const d of DENSITIES) {
              const dir = path.join(resDir, 'mipmap-' + d.name);
              fs.mkdirSync(dir, { recursive: true });
              const px = d.icon + 'x' + d.icon;
              const c = d.icon / 2;
              im([iconBase, '-resize', px, path.join(dir, 'ic_launcher.png')]);
              im([iconBase, '-resize', px, '-alpha', 'set', '(', '-size', px, 'xc:none', '-fill', 'white', '-draw', 'circle ' + c + ',' + c + ' ' + c + ',0', ')', '-compose', 'DstIn', '-composite', path.join(dir, 'ic_launcher_round.png')]);
            }
            // The template's adaptive icons would override these PNGs on Android 8+, so remove them
            fs.rmSync(path.join(resDir, 'mipmap-anydpi-v26'), { recursive: true, force: true });
            console.log('Launcher icons generated for all screen densities.');
          }

          // Splash logo: the app icon, a custom image, or none (color only)
          const splashMode = config.splashImageMode || 'icon';
          let splashSource = null;
          if (imBin && splashMode === 'custom' && config.splashImageDataUrl && config.splashImageDataUrl.startsWith('data:image/')) {
            try {
              const src = decodeImage(config.splashImageDataUrl, 'splash_source');
              if (src) { splashSource = path.resolve('splash_base.png'); makePng(src, splashSource, false); }
            } catch (err) {
              console.warn('Could not process the splash image: ' + err.message);
              splashSource = null;
            }
          } else if (splashMode === 'icon' && iconBase) {
            splashSource = iconBase;
          }

          let hasSplashLogo = false;
          if (imBin && splashSource) {
            const logoDp = Math.min(320, Math.max(48, Number(config.splashLogoSize) || 160));
            for (const d of DENSITIES) {
              const dir = path.join(resDir, 'drawable-' + d.name);
              fs.mkdirSync(dir, { recursive: true });
              const px = Math.round(logoDp * d.scale);
              im([splashSource, '-resize', px + 'x' + px, path.join(dir, 'splash_logo.png')]);
            }
            fs.mkdirSync(path.join(resDir, 'drawable'), { recursive: true });
            fs.writeFileSync(path.join(resDir, 'drawable', 'splash_screen.xml'), `<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/splashBackgroundColor" />
              <item>
                  <bitmap android:gravity="center" android:src="@drawable/splash_logo" />
              </item>
          </layer-list>
          `);
            hasSplashLogo = true;
            console.log('Splash logo generated (' + logoDp + 'dp).');
          }
          const launchBackground = hasSplashLogo ? '@drawable/splash_screen' : '@color/splashBackgroundColor';


          // Colors
          const themeColor = config.themeColor || '#2563eb';
          const statusBarColor = config.statusBarColor || '#1e293b';
          const navBarColor = config.navBarColor || '#0f172a';
          const splashBgColor = config.splashBgColor || '#0f172a';

          const colorsXml = `<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">${themeColor}</color>
              <color name="colorPrimaryDark">${statusBarColor}</color>
              <color name="colorAccent">${themeColor}</color>
              <color name="navigationBarColor">${navBarColor}</color>
              <color name="splashBackgroundColor">${splashBgColor}</color>
          </resources>`;
          fs.writeFileSync(path.join(resValuesDir, 'colors.xml'), colorsXml);

          // Styles
          const stylesXml = `<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:statusBarColor">@color/colorPrimaryDark</item>
                  <item name="android:navigationBarColor">@color/navigationBarColor</item>
                  ${config.fullscreen ? '<item name="android:windowFullscreen">true</item>' : ''}
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">${launchBackground}</item>
              </style>
          </resources>`;
          fs.writeFileSync(path.join(resValuesDir, 'styles.xml'), stylesXml);

          // Android 12+ draws its own splash screen, so set its color and logo as well
          const v31Dir = path.join(resDir, 'values-v31');
          fs.mkdirSync(v31Dir, { recursive: true });
          fs.writeFileSync(path.join(v31Dir, 'styles.xml'), `<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:windowSplashScreenBackground">@color/splashBackgroundColor</item>
                  ${hasSplashLogo ? '<item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_logo</item>' : ''}
              </style>
          </resources>
          `);

          // Permissions
          const perms = config.permissions || {};
          const PERMISSION_MAP = {
            networkState: [['ACCESS_NETWORK_STATE']],
            notifications: [['POST_NOTIFICATIONS']],
            vibrate: [['VIBRATE']],
            wakeLock: [['WAKE_LOCK']],
            camera: [['CAMERA']],
            microphone: [['RECORD_AUDIO']],
            audioSettings: [['MODIFY_AUDIO_SETTINGS']],
            storage: [['READ_EXTERNAL_STORAGE', 32], ['WRITE_EXTERNAL_STORAGE', 32]],
            mediaLibrary: [['READ_MEDIA_IMAGES'], ['READ_MEDIA_VIDEO'], ['READ_MEDIA_AUDIO']],
            bodySensors: [['BODY_SENSORS']],
            activityRecognition: [['ACTIVITY_RECOGNITION']],
            biometrics: [['USE_BIOMETRIC'], ['USE_FINGERPRINT']],
            geolocation: [['ACCESS_FINE_LOCATION'], ['ACCESS_COARSE_LOCATION']],
            backgroundLocation: [['ACCESS_BACKGROUND_LOCATION']],
            wifiState: [['ACCESS_WIFI_STATE']],
            bluetooth: [['BLUETOOTH', 30], ['BLUETOOTH_ADMIN', 30], ['BLUETOOTH_CONNECT'], ['BLUETOOTH_SCAN']],
            nfc: [['NFC']],
            contacts: [['READ_CONTACTS'], ['WRITE_CONTACTS']],
            calendar: [['READ_CALENDAR'], ['WRITE_CALENDAR']],
            accounts: [['GET_ACCOUNTS']],
            phoneState: [['READ_PHONE_STATE']],
            callPhone: [['CALL_PHONE']],
            sms: [['SEND_SMS'], ['READ_SMS'], ['RECEIVE_SMS']],
            foregroundService: [['FOREGROUND_SERVICE']],
            bootCompleted: [['RECEIVE_BOOT_COMPLETED']],
            exactAlarm: [['SCHEDULE_EXACT_ALARM']],
            overlay: [['SYSTEM_ALERT_WINDOW']],
            installPackages: [['REQUEST_INSTALL_PACKAGES']],
            setWallpaper: [['SET_WALLPAPER']],
          };
          // Hardware features are marked optional so the APK still installs on devices without them
          const FEATURE_MAP = {
            camera: ['android.hardware.camera', 'android.hardware.camera.autofocus'],
            microphone: ['android.hardware.microphone'],
            bluetooth: ['android.hardware.bluetooth', 'android.hardware.bluetooth_le'],
            nfc: ['android.hardware.nfc'],
            geolocation: ['android.hardware.location', 'android.hardware.location.gps'],
            phoneState: ['android.hardware.telephony'],
            callPhone: ['android.hardware.telephony'],
            sms: ['android.hardware.telephony'],
          };

          const manifestBefore = fs.readFileSync(manifestPath, 'utf8');
          const alreadyDeclared = (name) => manifestBefore.includes('android.permission.' + name + '"');
          const permissionLines = [];
          if (!alreadyDeclared('INTERNET')) permissionLines.push('<uses-permission android:name="android.permission.INTERNET" />');
          const addedPermissions = new Set();
          for (const [key, entries] of Object.entries(PERMISSION_MAP)) {
            if (!perms[key]) continue;
            for (const [name, maxSdk] of entries) {
              if (alreadyDeclared(name) || addedPermissions.has(name)) continue;
              addedPermissions.add(name);
              permissionLines.push('<uses-permission android:name="android.permission.' + name + '"' + (maxSdk ? ' android:maxSdkVersion="' + maxSdk + '"' : '') + ' />');
            }
          }
          const featureLines = [];
          for (const [key, names] of Object.entries(FEATURE_MAP)) {
            if (!perms[key]) continue;
            for (const n of names) {
              const line = '<uses-feature android:name="' + n + '" android:required="false" />';
              if (!featureLines.includes(line) && !manifestBefore.includes('"' + n + '"')) featureLines.push(line);
            }
          }
          const permissionsTags = [...permissionLines, ...featureLines].join('\n    ');
          console.log('Android permissions added: ' + (addedPermissions.size ? [...addedPermissions].join(', ') : 'none beyond the defaults'));

          // Orientation attribute
          let orientationAttr = 'android:screenOrientation="unspecified"';
          if (config.orientation === 'portrait') orientationAttr = 'android:screenOrientation="portrait"';
          else if (config.orientation === 'landscape') orientationAttr = 'android:screenOrientation="landscape"';
          else if (config.orientation === 'sensorPortrait') orientationAttr = 'android:screenOrientation="sensorPortrait"';

          // Patch AndroidManifest.xml
          let manifest = fs.readFileSync(manifestPath, 'utf8');
          manifest = manifest.replace('<application', `${permissionsTags}\n    <application`);
          manifest = manifest.replace('<activity', `<activity ${orientationAttr}`);
          if (config.cleartextTraffic) {
            manifest = manifest.replace('<application', '<application android:usesCleartextTraffic="true"');
          }
          fs.writeFileSync(manifestPath, manifest);

          console.log('Native Android customization injected successfully.');
          EOF

          node configure_app.js

          if [ "$BUILD_TYPE" != "zip" ]; then
            npx cap sync android
          fi

      - name: Build ZIP Project (uploaded code runs here, without any secrets)
        if: ${{ inputs.build_type == 'zip' }}
        env:
          ZIP_DOWNLOAD_URL: ${{ inputs.zip_download_url }}
        run: |
          set -e
          cd workspace
          WS="$(pwd)"

          if [ -z "$ZIP_DOWNLOAD_URL" ]; then
            echo "::error::No ZIP source was provided for this build."
            exit 1
          fi

          echo "Downloading ZIP project source..."
          curl -fsSL "$ZIP_DOWNLOAD_URL" -o project_src.zip
          mkdir -p extracted_src
          unzip -q project_src.zip -d extracted_src/
          rm -rf extracted_src/__MACOSX

          # Find the project folder: the shallowest folder holding package.json or index.html
          ROOT=""
          BEST=999
          while IFS= read -r f; do
            d="$(dirname "$f")"
            depth="$(printf '%s' "$d" | tr -cd '/' | wc -c)"
            if [ "$depth" -lt "$BEST" ]; then BEST="$depth"; ROOT="$d"; fi
          done < <(find extracted_src -maxdepth 4 \( -name node_modules -o -name .git \) -prune -o -type f \( -name package.json -o -name index.html \) -print)

          if [ -z "$ROOT" ]; then
            echo "::error::The ZIP has no package.json or index.html (searched up to 4 folders deep)."
            exit 1
          fi
          echo "Project folder: $ROOT"
          cd "$ROOT"

          RAN_BUILD=0
          if [ -f package.json ]; then
            echo "Installing dependencies (install scripts are disabled)..."
            if [ -f package-lock.json ]; then
              npm ci --ignore-scripts || npm install --ignore-scripts
            else
              npm install --ignore-scripts
            fi
            if node -e "const s=require('./package.json').scripts||{};process.exit(s.build?0:1)"; then
              echo "Running the build step..."
              npm run build
              RAN_BUILD=1
            else
              echo "No build script found, using the files as they are."
            fi
          fi

          OUT=""
          for candidate in dist build out www public .output/public; do
            if [ -f "$candidate/index.html" ]; then OUT="$candidate"; break; fi
          done
          if [ -z "$OUT" ] && [ "$RAN_BUILD" = "0" ] && [ -f index.html ]; then OUT="."; fi

          if [ -z "$OUT" ]; then
            echo "::error::No web output with an index.html was found (looked in dist, build, out, www and public). Next.js needs static export (output: 'export'). Projects that need a server cannot run inside an APK."
            exit 1
          fi

          echo "Packaging web output from: $OUT"
          rm -rf "$WS/www"
          mkdir -p "$WS/www"
          cp -a "$OUT/." "$WS/www/"

          cd "$WS"
          npx cap sync android

      - name: Report Build Step (Compiling)
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
        run: |
          curl -s -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -d '{"status":"building","progress":60,"step":"Compiling release Android bytecode with Gradle"}'

      - name: Compile Release APK with Gradle
        run: |
          set -e
          cd workspace/android
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Save Unsigned APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk
          path: workspace/android/app/build/outputs/apk/release/*.apk
          retention-days: 1

  # ============================================================================
  # JOB 2: Isolated Signing & Direct Storage Upload (HAS ACCESS TO SECRETS)
  # ============================================================================
  sign-and-upload-apk:
    name: Sign APK with Keystore & Upload to Private Storage
    needs: compile-untrusted-apk
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: unsigned-apk
          path: release-build/

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Add Android build-tools to PATH
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BT"
          echo "$BT" >> "$GITHUB_PATH"

      - name: Verify Signing Secrets & Execute apksigner
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APK_UPLOAD_URL: ${{ inputs.apk_upload_url }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
        run: |
          set -e

          # 1. Strict Keystore Secret Check: Fail with clear error if secrets are missing!
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: Missing required Android Keystore secrets in GitHub Actions repository."
            echo "Please configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_ALIAS in GitHub Secrets."

            curl -s -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $CALLBACK_TOKEN" \
              -d '{"status":"failed","progress":0,"step":"Signing failed","error":"Missing ANDROID_KEYSTORE_BASE64 or ANDROID_KEYSTORE_PASSWORD in GitHub repository secrets. Please configure signing keys in repository settings."}'

            exit 1
          fi

          UNSIGNED_APK=$(find release-build -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "ERROR: Unsigned APK artifact not found!"
            exit 1
          fi

          echo "Decoding release keystore..."
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

          # 2. Memory alignment with zipalign (4-byte alignment)
          zipalign -v -p 4 "$UNSIGNED_APK" aligned-release.apk

          # 3. Digital Signature with apksigner (v1 + v2 + v3)
          KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          KEY_AL="${KEY_ALIAS:-apkbuilder-release-key}"

          apksigner sign --ks release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_AL" \
            --key-pass pass:"$KEY_PASS" \
            --out final-signed-release.apk aligned-release.apk

          # Verify signature
          apksigner verify --verbose final-signed-release.apk
          echo "APK successfully signed and verified with apksigner."

          # 4. Upload DIRECTLY to Supabase Private Storage via Signed Upload URL (Bypasses Vercel payload limits!)
          APK_SIZE=$(stat -c%s final-signed-release.apk)
          APK_SHA256=$(sha256sum final-signed-release.apk | awk '{print $1}')

          echo "Uploading signed APK directly to Supabase storage (${APK_SIZE} bytes)..."
          curl -f -s -X PUT "$APK_UPLOAD_URL" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@final-signed-release.apk"

          echo "Direct upload to Supabase storage complete."

          # 5. Send Completion Webhook (Metadata only, no large base64 body!)
          curl -s -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -d "{\"status\":\"completed\",\"progress\":100,\"step\":\"Build completed and signed successfully\",\"apkFileSize\":$APK_SIZE,\"apkSha256\":\"$APK_SHA256\"}"

      - name: Report Failure on Error
        if: failure()
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
        run: |
          curl -s -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -d '{"status":"failed","progress":0,"step":"Build execution failed","error":"Compilation or apksigner signing failed. Check GitHub Actions workflow logs."}'
